<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Lyric Lingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--fg:#14213d;--mut:#5c677d;--card:#fff;--line:#d9dfeb;--hl:#ffe066;--acc:#2b59c3;--accfg:#fff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1626;--fg:#e8ecf5;--mut:#8f9bb3;--card:#18213a;--line:#2a3555;--hl:#5a4a05;--acc:#7aa2ff;--accfg:#0f1626}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:640px;margin:0 auto;padding:0 14px 80px}
h1{font:600 26px/1.1 Newsreader,Georgia,serif;margin:18px 0 12px}
.row{display:flex;gap:8px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=search],input[type=email],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
button{border:0;border-radius:8px;padding:11px 16px;background:var(--acc);color:var(--accfg);font-weight:600;cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#results{margin:10px 0;display:grid;gap:6px}
.res{display:flex;justify-content:space-between;gap:10px;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:400;width:100%}
.res small{color:var(--mut)}
.tag{font-size:12px;color:var(--acc);font-weight:600}
#status{color:var(--mut);font-size:14px;min-height:20px;margin:6px 0}
#song{display:none}
#song h2{font:600 22px/1.2 Newsreader,Georgia,serif;margin:14px 0 2px}
#song .by{color:var(--mut);margin:0 0 10px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.links a{color:var(--acc);font-weight:600;font-size:14px}
#ytwrap{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0}
#ytbox{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
#ytbox iframe{position:absolute;inset:0;width:100%;height:100%}
details{margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
summary{cursor:pointer;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.opts label{font-size:14px;color:var(--mut);display:block}
.chk{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0;font-size:15px}
.chk label{display:flex;align-items:center;gap:6px}
#lyrics{margin-top:8px}
.line{padding:10px 12px;border-radius:10px;margin:2px 0;cursor:pointer;scroll-margin-top:45vw;transition:background .2s}
.line .o{font:400 21px/1.35 Newsreader,Georgia,"Noto Serif CJK SC","Noto Serif JP",serif}
.line .r{color:var(--acc);font-size:15px;margin-top:2px}
.line .t{color:var(--mut);font-size:15px;margin-top:2px;font-style:italic}
.line.on{background:var(--hl)}
.line.on .t,.line.on .r{color:inherit}
.line.past .o{opacity:.55}
.hide-r .r,.hide-t .t{display:none}
.line .o{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cp{background:transparent;color:var(--mut);border:1px solid var(--line);padding:5px 7px;line-height:0;flex:none}
#ver{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;z-index:20;font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.cp svg{display:block}
.note{color:var(--mut);font-size:14px;margin:4px 0 8px}
</style>
</head>
<body>
<main>
<span id="ver" title="App version">v5</span>
<h1>Lyric Lingo</h1>
<div class="row">
  <input id="q" type="search" placeholder="Artist and song title" aria-label="Search song" enterkeyhint="search">
  <button id="go">Search</button>
</div>
<div id="status" role="status"></div>
<div id="results"></div>

<section id="song">
  <h2 id="sTitle"></h2>
  <p class="by" id="sBy"></p>
  <p class="note" id="sNote"></p>
  <div class="links">
    <a id="lnkYT" target="_blank" rel="noopener">Find on YouTube</a>
    <a id="lnkSP" target="_blank" rel="noopener">Find on Spotify</a>
  </div>
  <div class="row">
    <input id="yturl" type="text" placeholder="Paste YouTube link here" aria-label="YouTube link" inputmode="url">
    <button id="ytgo">Play</button>
  </div>
  <div id="ytwrap"><div id="ytbox"><div id="yt"></div></div></div>

  <details>
    <summary>Settings</summary>
    <div class="opts">
      <div><label for="slang">Song language</label>
        <select id="slang"><option value="auto">Auto-detect</option><option value="en">English</option><option value="it">Italian</option><option value="zh">Chinese</option><option value="ja">Japanese</option></select></div>
      <div><label for="tlang">Translate to</label>
        <select id="tlang"><option value="en">English</option><option value="ru">Russian</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option></select></div>
    </div>
    <div class="chk">
      <label><input type="checkbox" id="showR" checked> Pinyin / romaji</label>
      <label><input type="checkbox" id="showT" checked> Translation</label>
      <label><input type="checkbox" id="auto" checked> Auto-scroll</label>
    </div>
    <label for="off" style="font-size:14px;color:var(--mut)">Sync offset: <b id="offv">0.0</b> s (raise it if lyrics appear late)</label>
    <input id="off" type="range" min="-5" max="5" step="0.1" value="0" style="width:100%">
    <label for="mail" style="font-size:14px;color:var(--mut);display:block;margin-top:8px">Email for a higher free translation limit (optional)</label>
    <input id="mail" type="email" placeholder="you@example.com">
  </details>

  <details>
    <summary>No lyrics found? Paste your own</summary>
    <textarea id="paste" rows="5" placeholder="Paste .lrc text with timestamps, or plain lyrics"></textarea>
    <p><button class="ghost" id="usePaste">Use these lyrics</button></p>
  </details>

  <details>
    <summary>Better translation with a free AI chat</summary>
    <p class="note">1. Copy the prompt. 2. Paste it into any free AI chat (Claude, ChatGPT, Gemini). 3. Paste the answer back here.</p>
    <button class="ghost" id="aiCopy">Copy prompt with lyrics</button>
    <textarea id="aiin" rows="5" style="margin-top:8px" placeholder="Paste the AI answer here (one line per lyric, like: 1 | translation)"></textarea>
    <p><button class="ghost" id="aiApply">Apply answer</button></p>
  </details>

  <div id="lyrics"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/umd/wanakana.min.js"></script>
<script type="text/plain" id="jaWorker">
importScripts('https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js', 'https://cdn.jsdelivr.net/npm/wanakana@5.3.1/umd/wanakana.min.js');
let tk = null, q = [];
kuromoji.builder({dicPath: 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/'}).build((err, t) => {
  if(err){ postMessage({fail: String(err)}); return; }
  tk = t; postMessage({ready: 1}); q.forEach(run); q = [];
});
function conv(text){
  const out = [];
  tk.tokenize(text).forEach(t => {
    const s = t.surface_form;
    let r;
    if(t.pos === '助詞' && s === 'は') r = 'wa';
    else if(t.pos === '助詞' && s === 'へ') r = 'e';
    else if(t.pos === '助詞' && s === 'を') r = 'o';
    else r = wanakana.toRomaji(t.reading && t.reading !== '*' ? t.reading : s);
    if(out.length && (t.pos === '助動詞' || t.pos_detail_1 === '接尾')) out[out.length - 1] += r; else out.push(r);
  });
  return out.join(' ').replace(/ ([,.!?;:])/g, '$1');
}
function run(m){ let o; try { o = conv(m.text); } catch(e){ o = null; } postMessage({id: m.id, out: o}); }
onmessage = e => { if(tk) run(e.data); else q.push(e.data); };
</script>
<script>
const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let lines = [], songKey = '', player = null, active = -1, runId = 0;
const MM = {zh:'zh-CN', ja:'ja', it:'it', en:'en', ru:'ru', es:'es', fr:'fr', de:'de'};

const SV = 'viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
const IC_COPY = '<svg ' + SV + '><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const IC_OK = '<svg ' + SV + '><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const msgs = {g:'', r:'', t:''};
function showMsg(){ $('#status').textContent = Object.values(msgs).filter(Boolean).join(' '); }
function say(t){ msgs.g = t || ''; showMsg(); }
function setMsg(k, t){ msgs[k] = t || ''; showMsg(); }
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(e){}
  const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(a); a.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
  a.remove(); return ok;
}
function mmss(s){ s = Math.round(s || 0); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function decode(s){ return new DOMParser().parseFromString(s || '', 'text/html').documentElement.textContent; }

/* ---------- Lyrics search (LRCLIB) ---------- */
async function search(){
  const q = $('#q').value.trim(); if(!q) return;
  say('Searching…'); $('#results').innerHTML = '';
  try {
    const r = await fetch('https://lrclib.net/api/search?q=' + encodeURIComponent(q));
    if(!r.ok) throw new Error('Lyrics service replied with status ' + r.status);
    const data = await r.json();
    if(!Array.isArray(data)) throw new Error('Unexpected reply from lyrics service');
    const hits = data.filter(d => d.syncedLyrics || d.plainLyrics).slice(0, 12);
    if(!hits.length){ say('No lyrics found. Try fewer words, or paste lyrics below once you open a song.'); return; }
    say('Pick a version. Songs tagged "synced" work like karaoke.');
    hits.forEach(h => {
      const b = document.createElement('button'); b.className = 'res';
      const l = document.createElement('span'); l.textContent = h.trackName;
      const sm = document.createElement('small'); sm.textContent = ' ' + h.artistName + ' · ' + mmss(h.duration);
      l.appendChild(sm);
      const t = document.createElement('span'); t.className = 'tag'; t.textContent = h.syncedLyrics ? 'synced' : 'text only';
      b.append(l, t);
      b.onclick = () => openSong(h);
      $('#results').appendChild(b);
    });
  } catch(e){
    const hosted = location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname);
    say('Search failed (' + (e.message || 'network error') + '). ' + (hosted ? 'Check your connection and try again.' : 'Open the app from your GitHub Pages link, since it cannot reach the lyrics service from here.'));
  }
}

function parseLRC(t){
  const out = [];
  for(const raw of t.split('\n')){
    const m = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const text = raw.replace(/\[[^\]]*\]/g, '').trim();
    if(!m.length || !text) continue;
    m.forEach(x => out.push({t: +x[1]*60 + +x[2], text}));
  }
  return out.sort((a,b) => a.t - b.t);
}
function parsePlain(t){ return t.split('\n').map(s => s.trim()).filter(Boolean).map(text => ({t:null, text})); }

function openSong(h){
  $('#results').innerHTML = '';
  $('#sTitle').textContent = h.trackName; $('#sBy').textContent = h.artistName;
  const k = encodeURIComponent(h.artistName + ' ' + h.trackName);
  $('#lnkYT').href = 'https://www.youtube.com/results?search_query=' + k + '+lyrics';
  $('#lnkSP').href = 'https://open.spotify.com/search/' + k;
  $('#song').style.display = 'block';
  $('#sNote').textContent = h.duration ? 'Lyrics are timed for a version about ' + mmss(h.duration) + ' long. Pick a YouTube video of similar length.' : '';
  songKey = 'lrclib:' + h.id;
  loadLines(h.syncedLyrics ? parseLRC(h.syncedLyrics) : parsePlain(h.plainLyrics));
  say(h.syncedLyrics ? 'Paste a YouTube link below and press Play.' : 'No timing for this song, so lyrics will not scroll with the music.');
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* ---------- Language handling ---------- */
function detectLang(){
  const all = lines.map(l => l.text).join('');
  if(/[\u3040-\u30ff]/.test(all)) return 'ja';
  if((all.match(/[\u4e00-\u9fff]/g) || []).length > all.length * .2) return 'zh';
  const w = all.toLowerCase().match(/[a-zàèéìòù']+/g) || [];
  const IT = new Set(['che','non','di','il','per','con','sei','mi','ti','ci','una','un','è','sono','più','come','ma','se','lo','le','nel','del','io','tu','noi','così','anche','quando','sempre','e','vola','amore','cuore']);
  const EN = new Set(['the','you','and','to','is','it','of','me','my','in','that','on','for','your','be','we','are','but','this','with','love','all','not','just',"don't",'i']);
  let it = 0, en = 0; w.forEach(x => { if(IT.has(x)) it++; if(EN.has(x)) en++; });
  return it > en ? 'it' : 'en';
}
function songLang(){ const v = $('#slang').value; return v === 'auto' ? detectLang() : v; }

/* Japanese readings run in a background worker, so the page never freezes */
let jaW = null, jaState = 'idle', jaId = 0; const jaPending = {};
function jaFail(){
  jaState = 'failed';
  setMsg('r', 'Japanese readings could not load, so only kana is converted. Use the AI option below for kanji.');
  for(const k in jaPending){ jaPending[k](null); delete jaPending[k]; }
}
function jaStart(){
  if(jaW || jaState === 'failed') return;
  jaState = 'loading';
  try { jaW = new Worker(URL.createObjectURL(new Blob([$('#jaWorker').textContent], {type: 'text/javascript'}))); }
  catch(e){ jaFail(); return; }
  jaW.onmessage = e => {
    const m = e.data;
    if(m.ready){ jaState = 'ready'; setMsg('r', ''); }
    else if(m.fail){ jaFail(); }
    else if(jaPending[m.id]){ jaPending[m.id](m.out); delete jaPending[m.id]; }
  };
  jaW.onerror = jaFail;
  setMsg('r', 'Preparing Japanese readings (first time takes a while, the page stays usable)…');
  setTimeout(() => { if(jaState === 'loading') jaFail(); }, 120000);
}
function jaConvert(text){
  jaStart();
  if(jaState === 'failed') return Promise.resolve(null);
  return new Promise(res => { const id = ++jaId; jaPending[id] = res; jaW.postMessage({id, text}); });
}
async function romanize(text, lang){
  if(lang === 'zh') return window.pinyinPro.pinyin(text, {toneType: 'symbol'});
  if(lang === 'ja'){
    const r = await jaConvert(text);
    if(r != null) return r;
    return window.wanakana ? window.wanakana.toRomaji(text) : '';
  }
  return '';
}
async function translate(text, src, tgt){
  const mail = $('#mail').value.trim();
  const u = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + MM[src] + '|' + MM[tgt] + (mail ? '&de=' + encodeURIComponent(mail) : '');
  const j = await (await fetch(u)).json();
  if(+j.responseStatus === 200){
    const ms = Array.isArray(j.matches) ? j.matches.filter(m => m.translation) : [];
    const best = ms.sort((x, y) => y.match - x.match)[0];
    const txt = decode(best ? best.translation : j.responseData.translatedText);
    const score = best ? +best.match : +j.responseData.match;
    return (score < 0.7 ? '≈ ' : '') + txt;
  }
  const e = new Error(j.responseDetails || 'failed'); e.quota = +j.responseStatus === 429; throw e;
}

/* ---------- Render + enrich ---------- */
function loadLines(arr){ lines = arr; active = -1; render(); enrich(); }

function render(){
  const box = $('#lyrics'); box.innerHTML = '';
  lines.forEach((l, i) => {
    const d = document.createElement('div'); d.className = 'line'; d.id = 'L' + i;
    ['o','r','t'].forEach(c => { const e = document.createElement('div'); e.className = c; d.appendChild(e); });
    const tx = document.createElement('span'); tx.textContent = l.text;
    const cb = document.createElement('button'); cb.className = 'cp'; cb.innerHTML = IC_COPY; cb.title = 'Copy this line'; cb.setAttribute('aria-label', 'Copy this line');
    cb.onclick = async ev => { ev.stopPropagation(); const ok = await copyText(l.text); cb.innerHTML = ok ? IC_OK : '!'; setTimeout(() => cb.innerHTML = IC_COPY, 1200); };
    d.firstChild.append(tx, cb);
    d.onclick = () => { if(player && player.seekTo && l.t != null) player.seekTo(Math.max(0, l.t - off()), true); };
    box.appendChild(d);
  });
  applyToggles();
}
function applyToggles(){
  const b = $('#lyrics');
  b.classList.toggle('hide-r', !$('#showR').checked);
  b.classList.toggle('hide-t', !$('#showT').checked);
}

async function enrich(){
  const id = ++runId, src = songLang(), tgt = $('#tlang').value;
  const rKey = 'r:' + songKey + ':' + src, tKey = 't:' + songKey + ':' + src + ':' + tgt;
  const rCache = store.get(rKey) || {}, tCache = store.get(tKey) || {};
  const el = (i, c) => document.querySelector('#L' + i + ' .' + c);
  setMsg('r', ''); setMsg('t', '');

  async function doRoman(){
    if(src !== 'zh' && src !== 'ja') return;
    for(let i = 0; i < lines.length; i++){
      if(id !== runId) return;
      try {
        let v = rCache[i];
        if(v == null){ v = await romanize(lines[i].text, src); if(!(src === 'ja' && jaState !== 'ready')) rCache[i] = v; }
        el(i, 'r').textContent = v;
      } catch(e){}
    }
    if(id === runId){ store.set(rKey, rCache); if(jaState !== 'failed') setMsg('r', ''); }
  }

  async function doTrans(){
    if(src === tgt) return;
    setMsg('t', 'Translating…');
    let quota = false, failed = 0;
    const queue = lines.map((_, i) => i);
    async function worker(){
      while(queue.length && !quota){
        const i = queue.shift();
        if(id !== runId) return;
        try {
          if(tCache[i] == null) tCache[i] = await translate(lines[i].text, src, tgt);
          el(i, 't').textContent = tCache[i];
        } catch(e){ if(e.quota) quota = true; else failed++; }
      }
    }
    await Promise.all([worker(), worker(), worker()]);
    if(id !== runId) return;
    store.set(tKey, tCache);
    setMsg('t', quota ? 'Daily free translation limit reached. Add your email in Settings for a higher limit, or use the AI option below.' : failed ? 'Some lines could not be translated. The AI option below can fill them in.' : '');
  }

  await Promise.all([doRoman(), doTrans()]);
}

/* ---------- YouTube player + sync ---------- */
function ytId(s){ const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : null; }
let apiP = null;
function loadYT(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  if(!apiP) apiP = new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  });
  return apiP;
}
async function playVideo(){
  const id = ytId($('#yturl').value.trim());
  if(!id){ say('That does not look like a YouTube link.'); return; }
  say(''); $('#ytwrap').style.display = 'block';
  await loadYT();
  if(player && player.loadVideoById){ player.loadVideoById(id); return; }
  player = new YT.Player('yt', {videoId: id, playerVars: {playsinline: 1, rel: 0}, events: {onReady: e => e.target.playVideo()}});
}
function off(){ return parseFloat($('#off').value) || 0; }

setInterval(() => {
  if(!player || !player.getCurrentTime || !lines.length || lines[0].t == null) return;
  if(player.getPlayerState && player.getPlayerState() !== 1) return;
  const now = player.getCurrentTime() + off();
  let idx = -1;
  for(let i = 0; i < lines.length; i++){ if(lines[i].t <= now) idx = i; else break; }
  if(idx === active) return;
  active = idx;
  lines.forEach((_, i) => { const e = document.getElementById('L' + i); e.classList.toggle('on', i === idx); e.classList.toggle('past', i < idx); });
  if(idx >= 0 && $('#auto').checked) document.getElementById('L' + idx).scrollIntoView({behavior: 'smooth', block: 'start'});
}, 200);

/* ---------- Wiring ---------- */
$('#go').onclick = search;
$('#q').addEventListener('keydown', e => { if(e.key === 'Enter') search(); });
$('#ytgo').onclick = playVideo;
$('#yturl').addEventListener('keydown', e => { if(e.key === 'Enter') playVideo(); });
$('#showR').onchange = $('#showT').onchange = applyToggles;
$('#slang').onchange = $('#tlang').onchange = () => { if(lines.length){ render(); enrich(); } };
$('#off').oninput = () => { $('#offv').textContent = off().toFixed(1); };
$('#usePaste').onclick = () => {
  const t = $('#paste').value.trim(); if(!t) return;
  const synced = parseLRC(t);
  songKey = 'manual:' + t.length + ':' + t.slice(0, 20);
  if(!$('#sTitle').textContent) $('#sTitle').textContent = 'Pasted lyrics';
  $('#sNote').textContent = '';
  $('#song').style.display = 'block';
  loadLines(synced.length > 3 ? synced : parsePlain(t));
};

/* ---------- Free AI-chat translation ---------- */
function aiPrompt(){
  const src = songLang(), names = {en: 'English', it: 'Italian', zh: 'Chinese', ja: 'Japanese'};
  const tgt = $('#tlang').selectedOptions[0].textContent;
  const rom = src === 'zh' ? 'pinyin with tone marks' : src === 'ja' ? 'romaji (Hepburn, words separated by spaces)' : '';
  return `I am learning ${names[src]} from song lyrics. For each numbered line below, reply with exactly one line in this format:\nnumber | ${rom ? rom + ' | ' : ''}natural ${tgt} translation\nTranslate the meaning in the context of the whole song, not word by word. Use plain text (no table, no code block), keep every number, and add nothing else.\n\n` + lines.map((l, i) => (i + 1) + ' | ' + l.text).join('\n');
}
function applyAI(){
  const src = songLang(), tgt = $('#tlang').value, hasR = src === 'zh' || src === 'ja', rC = {}, tC = {};
  let n = 0;
  $('#aiin').value.split('\n').forEach(row => {
    const p = row.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(x => x.trim()), i = parseInt(p[0], 10) - 1;
    if(!(i >= 0 && i < lines.length) || p.length < 2) return;
    if(hasR && p.length >= 3){ rC[i] = p[1]; tC[i] = p.slice(2).join(' | '); } else tC[i] = p.slice(1).join(' | ');
    n++;
  });
  if(!n){ say('Could not read the answer. Each line should look like: 1 | translation'); return; }
  if(Object.keys(rC).length) store.set('r:' + songKey + ':' + src, rC);
  store.set('t:' + songKey + ':' + src + ':' + tgt, tC);
  render(); enrich(); say('Applied ' + n + ' lines.');
}
$('#aiCopy').onclick = async () => { if(!lines.length) return; say((await copyText(aiPrompt())) ? 'Prompt copied. Paste it into your AI chat.' : 'Copy failed. Try again.'); };
$('#aiApply').onclick = applyAI;
</script>
